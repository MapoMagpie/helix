name: Nightly Build
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish Nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Fetch and compile tree-sitter grammars
        run: cargo run --package=helix-loader --bin=hx-loader

      - name: Build packages
        shell: bash
        run: |
          set -ex

          date=$(date +%Y%m%d)

          # Remove grammar sources (keep only compiled .so files)
          rm -rf runtime/grammars/sources

          mkdir -p dist

          # Runtime archive (queries + compiled grammars)
          tar cJf dist/helix-runtime.tar.xz runtime

          # Source archive
          tar cJf dist/helix-nightly-$date-source.tar.xz \
              --exclude='runtime/grammars' \
              --exclude='.git' \
              --exclude='target' \
              --exclude='dist' \
              .

          echo "VERSION=$date" >> $GITHUB_ENV

      - name: Update nightly release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "Nightly Build"
          tag_name: nightly
          prerelease: true
          files: dist/*
          body: |
            Nightly build from `my-helix` branch.

            Built at: ${{ github.event.repository.updated_at }}

            | File | Purpose |
            |------|---------|
            | `helix-runtime.tar.xz` | Pre-compiled runtime (queries + grammars, for NixOS builds) |
            | `helix-nightly-*-source.tar.xz` | Full source tree |
